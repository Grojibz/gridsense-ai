# Local infrastructure for GridSense AI.
#   docker compose up -d
#
# Services:
#   postgres  — Postgres 16 with the pgvector extension (documents + embeddings + logs)
#   mlflow    — experiment tracking + model registry (backed by the same Postgres)
#   langfuse  — LLM tracing / cost / latency dashboards (own Postgres for isolation)
#
# All values are dev defaults; override via .env (see .env.example). Do not use in prod.

name: gridsense

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gridsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridsense}
      POSTGRES_DB: ${POSTGRES_DB:-gridsense}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridsense}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    # Upstream mlflow image + psycopg2 (needed for the Postgres backend store).
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-gridsense}:${POSTGRES_PASSWORD:-gridsense}@postgres:5432/${POSTGRES_DB:-gridsense}
      --artifacts-destination /mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy

  # Langfuse ships its own Postgres so its schema stays isolated from app data.
  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfusedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev-secret-change-me}
      SALT: ${LANGFUSE_SALT:-dev-salt-change-me}
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap: auto-create an org/project/user and fixed API keys on first
      # start, so the app can trace without anyone clicking through the UI. Dev-only.
      LANGFUSE_INIT_ORG_ID: gridsense
      LANGFUSE_INIT_ORG_NAME: GridSense
      LANGFUSE_INIT_PROJECT_ID: docrag
      LANGFUSE_INIT_PROJECT_NAME: DocRAG
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-gridsense-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-gridsense-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-dev@gridsense.local}
      LANGFUSE_INIT_USER_NAME: GridSense Dev
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-gridsense-dev}
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy

  # GridSense FastAPI app (DocRAG /ask + DegradeML /predict). The LLM provider (Ollama)
  # runs on the host, reached via host.docker.internal; datastores are compose services.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Ollama defaults num_ctx to 2048 whatever the model supports, silently truncating
      # a RAG prompt that carries several chunks.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      # Must reach the container too: a host GPU that computes incorrectly produces
      # fluent garbage and corrupted embeddings, and the API would inherit both.
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gridsense}:${POSTGRES_PASSWORD:-gridsense}@postgres:5432/${POSTGRES_DB:-gridsense}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-gridsense-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-gridsense-dev}
    ports:
      - "8000:8000"
    volumes:
      # The corpus is deliberately not baked into the image (`data` is in .dockerignore);
      # mounting it read-only keeps the image lean and lets `docker compose exec api
      # python -m gridsense.docrag.ingest data/docs` work against whatever is on the host.
      - ./data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

volumes:
  pgdata:
  mlartifacts:
  langfusedata:
