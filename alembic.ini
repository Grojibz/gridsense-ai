# Alembic configuration. The database URL is deliberately absent: it lives in DATABASE_URL,
# read by migrations/env.py, so a connection string never sits in a tracked file and the
# same command targets local, CI and production without editing anything.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# UTC, sortable, and the revision id is still what orders the chain — the timestamp is there
# so a directory listing reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
