apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridsense-api
  namespace: gridsense
  labels:
    app.kubernetes.io/name: gridsense-api
    app.kubernetes.io/part-of: gridsense
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gridsense-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gridsense-api
        app.kubernetes.io/part-of: gridsense
    spec:
      # Pod-level defaults; the container overrides nothing below. Set here so any sidecar
      # added later inherits them rather than quietly running as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with an immutable reference before deploying — ideally a digest:
          #   image: registry.example.com/gridsense-api@sha256:<digest>
          # `latest` names a moving target: two nodes can serve different builds under it,
          # and there is nothing to roll back *to*. `Always` at least makes every pod start
          # fetch the current one, so a restart cannot silently resurrect a cached old
          # build — the failure mode that makes "we rolled back" untrue.
          image: gridsense-api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: gridsense-config
            - secretRef:
                name: gridsense-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # readOnlyRootFilesystem needs somewhere writable for anything that spools to
          # disk (tempfiles, matplotlib/HF caches pulled in by the ML stack).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Readiness and liveness answer different questions and must not share an
          # endpoint. /ready checks Postgres: failing it pulls the pod out of the Service
          # until it recovers. /health checks only that the process is serving: failing it
          # *kills the container*, which would be the wrong response to a database blip.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
