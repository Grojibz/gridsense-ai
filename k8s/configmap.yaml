# Non-secret configuration for the GridSense API.
# Datastores and the LLM provider are treated as external endpoints — point these at your
# managed Postgres/MLflow/Langfuse/Ollama (or in-cluster services).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gridsense-config
  namespace: gridsense
data:
  ENVIRONMENT: "k8s"
  LOG_LEVEL: "INFO"
  # Chat and embeddings are separate: Anthropic serves no embeddings API.
  CHAT_PROVIDER: "ollama"
  EMBEDDING_PROVIDER: "ollama"
  ANTHROPIC_MODEL: "claude-opus-5"
  ANTHROPIC_EFFORT: "high"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_CHAT_MODEL: "llama3.2"
  OLLAMA_EMBEDDING_MODEL: "nomic-embed-text"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  LANGFUSE_HOST: "http://langfuse:3000"
