# Secret values for the GridSense API. PLACEHOLDERS — do not commit real secrets;
# create this from your secret manager / CI, or `kubectl create secret generic ...`.
apiVersion: v1
kind: Secret
metadata:
  name: gridsense-secrets
  namespace: gridsense
type: Opaque
stringData:
  # REQUIRED. The app refuses to start outside ENVIRONMENT=local/test without this — /ask
  # and /agent both spend provider credits per request, so an open deployment is an
  # unmetered bill. Comma-separated to allow rotation without a flag-day cutover.
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  API_KEYS: ""
  DATABASE_URL: "postgresql+psycopg://gridsense:gridsense@postgres:5432/gridsense"
  LANGFUSE_PUBLIC_KEY: "pk-lf-gridsense-dev"
  LANGFUSE_SECRET_KEY: "sk-lf-gridsense-dev"
  # Set this if CHAT_PROVIDER=anthropic:
  ANTHROPIC_API_KEY: ""
  # Set this if EMBEDDING_PROVIDER=voyage:
  VOYAGE_API_KEY: ""
  # Set these if either provider is azure:
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_API_KEY: ""
