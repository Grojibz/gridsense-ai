# Secret values for the GridSense API. PLACEHOLDERS — do not commit real secrets;
# create this from your secret manager / CI, or `kubectl create secret generic ...`.
apiVersion: v1
kind: Secret
metadata:
  name: gridsense-secrets
  namespace: gridsense
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://gridsense:gridsense@postgres:5432/gridsense"
  LANGFUSE_PUBLIC_KEY: "pk-lf-gridsense-dev"
  LANGFUSE_SECRET_KEY: "sk-lf-gridsense-dev"
  # Set this if CHAT_PROVIDER=anthropic:
  ANTHROPIC_API_KEY: ""
  # Set these if either provider is azure:
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_API_KEY: ""
