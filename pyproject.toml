[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridsense"
version = "0.0.0"
description = "RAG assistant over technical docs + MLOps pipeline for battery-degradation prediction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GridSense AI" }]

# M0 core: only what the scaffold (config + FastAPI app) needs.
# Heavy module stacks live in optional extras below and are wired up in their
# own milestones (M1+ docrag, M3+ degrade) to keep the base install lean and CI fast.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Module A — DocRAG (wired up from M1)
docrag = [
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-voyageai>=0.4",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "sqlalchemy>=2.0",
    "pypdf>=4.0",
    "langfuse>=2.39,<3",
]
# Module B — DegradeML (wired up from M3)
degrade = [
    "scikit-learn>=1.4",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    # Pin to 2.x to match the docker-compose MLflow server (v2.12.1).
    "mlflow>=2.12,<3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "evidently>=0.4,<0.5",
]
# Agentic surface — the native Anthropic SDK (tool runner, prompt caching, effort,
# refusal handling) plus the MCP server. Kept out of `docrag` so the RAG image stays lean;
# LangChain is the abstraction for the chain, the raw SDK is what the agent needs.
agent = [
    "anthropic>=0.116",
    "mcp>=2.0",
]
# Eval harness — RAGAS + its dataset/arrow stack. Kept out of `docrag` so the API image
# and the unit-test CI job stay lean; only the eval workflow installs it.
eval = [
    "ragas>=0.4,<0.5",
    # ragas still imports the pre-1.0 `langchain_community.chat_models.vertexai` path,
    # which langchain-community 0.4 removed. 0.3.x is compatible with langchain-core 1.x.
    "langchain-community>=0.3.31,<0.4",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # FastAPI TestClient
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/Grojibz/gridsense-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/gridsense"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["gridsense"]

[tool.mypy]
python_version = "3.11"
files = ["src/gridsense"]
# Most third-party packages here ship no stubs (mlflow, evidently, ragas, langfuse). Without
# this every import is an error and the real findings drown in them.
ignore_missing_imports = true
# Deliberately not `strict`. The value at this stage is catching contradictions inside code
# that *is* annotated — which is nearly all of it — not forcing annotations onto the ML
# scripts, where `Any` is often the honest type for a model object.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# `providers.py` is ~140 lines of nothing but third-party constructor calls, and every error
# it produces is an artefact of how those libraries are typed rather than a defect here:
#   - pydantic models whose `api_key: SecretStr` accepts a `str` and coerces it;
#   - fields declared under an alias, so the generated __init__ signature does not list the
#     name that actually works (`request_timeout` on AzureChatOpenAI — verified to reach the
#     underlying client);
#   - `**extra` unpacking into a model with heterogeneous field types.
# Suppressing these two codes here is a real trade: a genuine wrong-argument bug in this
# module would also go unreported. What covers that instead is `tests/test_providers.py`,
# which asserts against the *built client object* rather than the kwargs dict — precisely
# because a parameter passed the wrong way is accepted, warned about once, and never sent.
[[tool.mypy.overrides]]
module = "gridsense.providers"
disable_error_code = ["arg-type", "call-arg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["gridsense"]
branch = true

[tool.coverage.report]
# Set from the measured total (81%), not from an aspiration. A gate above what the suite
# actually reaches fails on the first PR and gets deleted; one far below it never fires.
# The point is to catch a *drop* — code added without tests — so it moves up when real
# coverage does, never down to accommodate a regression.
#
# The floor is deliberately global rather than per-file. The low files are the ML scripts
# (train.py 37%, monitor.py 47%): they are covered end-to-end by the gated integration
# tests, which do not run here, so a per-file rule would either fail permanently or need
# per-file exemptions that hide the real number.
fail_under = 80
show_missing = true
