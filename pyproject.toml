[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridsense"
version = "0.0.0"
description = "RAG assistant over technical docs + MLOps pipeline for battery-degradation prediction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GridSense AI" }]

# M0 core: only what the scaffold (config + FastAPI app) needs.
# Heavy module stacks live in optional extras below and are wired up in their
# own milestones (M1+ docrag, M3+ degrade) to keep the base install lean and CI fast.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Module A — DocRAG (wired up from M1)
docrag = [
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "sqlalchemy>=2.0",
    "pypdf>=4.0",
    "langfuse>=2.39,<3",
]
# Module B — DegradeML (wired up from M3)
degrade = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "mlflow>=2.12",
    "evidently>=0.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # FastAPI TestClient
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/your-org/gridsense-ai"

[tool.hatch.build.targets.wheel]
packages = ["src/gridsense"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["gridsense"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["gridsense"]
branch = true
